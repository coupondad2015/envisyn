<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EnviSyn • Mosaic Simon</title>
  <style>
    :root {
      --bg: #d6c6ad;
      --rim-gold-dark: #7b5a24;
      --rim-gold-light: #f0d8a2;

      /* EnviSyn-ish pad colors */
      --teal: #0e726f;
      --teal-active: #1ab0aa;

      --gold: #d9aa3a;
      --gold-active: #ffcf5a;

      --ivory: #f5f1e6;
      --ivory-active: #ffffff;

      --bronze: #b06632;
      --bronze-active: #e6863d;

      --center-dark: #22242a;
      --center-glow: #54c1c5;
      --text-main: #22242a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #f5efe5 0, var(--bg) 55%, #b49c7d 100%);
      color: #222;
    }

    .game-shell {
      text-align: center;
      color: #fff;
    }

    .title {
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 18px;
      color: rgba(255, 255, 255, 0.7);
    }

    .device {
      position: relative;
      width: 380px;
      height: 380px;
      margin: 0 auto 22px;
      border-radius: 50%;
      overflow: hidden;

      /* outer rim */
      background: radial-gradient(circle at 30% 20%, #f7e6bf 0, #d7b474 35%, #8a5f26 70%, #5a3a18 100%);
      box-shadow:
        0 24px 40px rgba(0, 0, 0, 0.45),
        0 0 0 6px rgba(255, 255, 255, 0.21),
        inset 0 0 0 10px rgba(0, 0, 0, 0.55);
    }

    /* decorative inner rim */
    .device::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 25% 20%, #fdf6e7 0, #f1dfb7 40%, #ba8a3a 75%, #2a2014 100%);
      box-shadow:
        inset 0 8px 18px rgba(255, 255, 255, 0.45),
        inset 0 -10px 18px rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    /* pad container circle inside the rim */
    .pad-ring {
      position: absolute;
      inset: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #15181d 0, #090a0d 45%, #050507 100%);
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.7),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      z-index: 1;
      overflow: hidden;
    }

    .pad {
      position: absolute;
      width: 50%;
      height: 50%;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
      background-size: 140% 140%;
      background-position: 30% 20%;
      transition:
        filter 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease,
        opacity 0.18s ease;
    }

    .pad::after {
      /* subtle bevel highlight */
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: inherit;
      background: radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.55), transparent 55%);
      mix-blend-mode: screen;
      opacity: 0.75;
      pointer-events: none;
    }

    .pad-top {
      top: 0;
      left: 0;
      border-radius: 100% 0 0 0;
      background-image:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.75), transparent 55%),
        linear-gradient(145deg, #084244, var(--teal));
    }

    .pad-right {
      top: 0;
      right: 0;
      border-radius: 0 100% 0 0;
      background-image:
        radial-gradient(circle at 70% 20%, rgba(255, 255, 255, 0.75), transparent 55%),
        linear-gradient(35deg, #8d6215, var(--gold));
    }

    .pad-bottom {
      bottom: 0;
      right: 0;
      border-radius: 0 0 100% 0;
      background-image:
        radial-gradient(circle at 80% 65%, rgba(255, 255, 255, 0.75), transparent 55%),
        linear-gradient(35deg, #7e3a1b, var(--bronze));
    }

    .pad-left {
      bottom: 0;
      left: 0;
      border-radius: 0 0 0 100%;
      background-image:
        radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.85), transparent 55%),
        linear-gradient(215deg, #d4cbb7, var(--ivory));
    }

    .pad:not(.active) {
      filter: brightness(0.8) saturate(0.9);
      box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.45);
    }

    .pad.active {
      filter: brightness(1.18) saturate(1.15);
      box-shadow:
        0 0 20px rgba(255, 255, 255, 0.6),
        inset 0 0 10px rgba(255, 255, 255, 0.85);
      transform: translateY(1px);
    }

    /* center Start button */

    .start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      z-index: 3;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.82rem;
      background:
        radial-gradient(circle at 30% 20%, #ffffff, #e6f4f3 45%, #c8e2df 60%, #2a3038 82%, #070809 100%);
      box-shadow:
        0 0 0 6px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(84, 193, 197, 0.7),
        inset 0 2px 8px rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .start-btn span.sub {
      font-size: 0.6rem;
      text-transform: none;
      letter-spacing: 0.16em;
      opacity: 0.82;
    }

    .start-btn:active {
      transform: translate(-50%, -50%) scale(0.97);
      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.85),
        0 0 18px rgba(84, 193, 197, 0.7),
        inset 0 4px 6px rgba(0, 0, 0, 0.6);
    }

    .status {
      margin-top: 6px;
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.86);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
    }

    .status span.level {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="title">ENVISYN • MOSAIC SIMON</div>

    <div class="device">
      <div class="pad-ring">
        <button class="pad pad-top" data-pad="0" aria-label="Top pad"></button>
        <button class="pad pad-right" data-pad="1" aria-label="Right pad"></button>
        <button class="pad pad-bottom" data-pad="2" aria-label="Bottom pad"></button>
        <button class="pad pad-left" data-pad="3" aria-label="Left pad"></button>
      </div>

      <button id="startButton" class="start-btn">
        <span>Start</span>
        <span class="sub">Action Cures Fear</span>
      </button>
    </div>

    <div id="status" class="status">
      Tap <strong>Start</strong> to watch the pattern.
    </div>
  </div>

  <script>
    const pads = document.querySelectorAll(".pad");
    const startButton = document.getElementById("startButton");
    const statusEl = document.getElementById("status");

    let sequence = [];
    let playerIndex = 0;
    let acceptingInput = false;
    let level = 0;
    let timeouts = [];

    function randomPadIndex() {
      return Math.floor(Math.random() * 4);
    }

    function clearAllTimeouts() {
      timeouts.forEach(t => clearTimeout(t));
      timeouts = [];
    }

    function resetGame() {
      clearAllTimeouts();
      sequence = [];
      playerIndex = 0;
      level = 0;
      acceptingInput = false;
    }

    function startGame() {
      resetGame();
      nextRound();
    }

    function nextRound() {
      level++;
      sequence.push(randomPadIndex());
      playerIndex = 0;
      acceptingInput = false;
      statusEl.innerHTML = `Watch the pattern… <span class="level">Level ${level}</span>`;
      playSequence();
    }

    function playSequence() {
      const stepDuration = 650;
      const startDelay = 600;
      clearAllTimeouts();
      sequence.forEach((padIndex, i) => {
        const t = setTimeout(() => {
          lightPad(padIndex);
        }, startDelay + i * stepDuration);
        timeouts.push(t);
      });

      const totalTime = startDelay + sequence.length * stepDuration;
      const tDone = setTimeout(() => {
        statusEl.textContent = "Now repeat the pattern.";
        acceptingInput = true;
      }, totalTime + 150);
      timeouts.push(tDone);
    }

    function lightPad(index) {
      const pad = document.querySelector(`.pad[data-pad="${index}"]`);
      if (!pad) return;
      pad.classList.add("active");
      const t = setTimeout(() => pad.classList.remove("active"), 420);
      timeouts.push(t);
    }

    function flashAllPadsOnce() {
      pads.forEach(p => p.classList.add("active"));
      const t = setTimeout(() => {
        pads.forEach(p => p.classList.remove("active"));
      }, 420);
      timeouts.push(t);
    }

    function handlePlayerInput(index) {
      if (!acceptingInput) return;

      lightPad(index);

      if (index === sequence[playerIndex]) {
        playerIndex++;

        if (playerIndex === sequence.length) {
          // completed correctly
          acceptingInput = false;
          statusEl.textContent = "Beautiful. Get ready for the next pattern.";
          const t = setTimeout(nextRound, 900);
          timeouts.push(t);
        }
      } else {
        // mistake – this is the ONLY time all four flash together
        acceptingInput = false;
        statusEl.textContent = "Almost. Watch the pattern again and try once more.";
        flashAllPadsOnce();
        playerIndex = 0;

        const t = setTimeout(() => {
          playSequence();
        }, 1100);
        timeouts.push(t);
      }
    }

    pads.forEach(pad => {
      pad.addEventListener("click", () => {
        const idx = Number(pad.dataset.pad);
        handlePlayerInput(idx);
      });
    });

    startButton.addEventListener("click", () => {
      startGame();
    });
  </script>
</body>
</html>
