<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mosaic Simon Says – EnviSyn</title>
  <style>
    :root {
      --bg-main: #0b2224;
      --bg-inner: #102a2d;
      --ring-gold: #c9a35a;
      --ring-gold-dark: #8a6c30;
      --button-1: #6fc2b0;
      --button-2: #f1c87b;
      --button-3: #e89a86;
      --button-4: #9ab6e4;
      --button-active-overlay: rgba(255, 255, 255, 0.28);
      --text-main: #f8f4ec;
      --text-subtle: #c7d3cf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #17393d 0, #050b0c 60%);
      color: var(--text-main);
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .game-title {
      font-size: 1.1rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--text-subtle);
      text-align: center;
    }

    .game-subtitle {
      font-size: 0.9rem;
      color: var(--text-subtle);
      opacity: 0.9;
      text-align: center;
    }

    /* --- sound toggle --- */
    .sound-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 4px;
      font-size: 0.8rem;
      color: var(--text-subtle);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #555;
      border-radius: 34px;
      transition: 0.2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider {
      background-color: #d0a95a;
    }
    .switch input:checked + .slider:before {
      transform: translateX(20px);
    }

    .device-shell {
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #20393d 0, #050a0b 65%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      position: relative;
    }

    .device-ring {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #f5deb3 0, #8a6c30 70%);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 0 12px rgba(0, 0, 0, 0.6),
        0 0 16px rgba(0, 0, 0, 0.9);
    }

    .device-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #23383b 0, #050a0b 90%);
      position: relative;          /* changed for quadrant layout */
      padding: 28px;
    }

    .pad {
      position: absolute;
      width: 50%;
      height: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        inset 0 0 18px rgba(0, 0, 0, 0.6),
        0 14px 18px rgba(0, 0, 0, 0.7);
      transition:
        transform 0.12s ease-out,
        box-shadow 0.12s ease-out,
        filter 0.12s ease-out;
      overflow: hidden;
    }

    .pad::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.35), transparent 55%);
      opacity: 0.75;
      pointer-events: none;
    }

    /* symmetrical quadrant shapes */
    .pad-0 {
      top: 0;
      left: 0;
      border-radius: 100% 0 0 0;
      background: linear-gradient(135deg, #5cae9b, var(--button-1));
    }
    .pad-1 {
      top: 0;
      right: 0;
      border-radius: 0 100% 0 0;
      background: linear-gradient(45deg, #dfb568, var(--button-2));
    }
    .pad-2 {
      bottom: 0;
      left: 0;
      border-radius: 0 0 0 100%;
      background: linear-gradient(225deg, #d17c66, var(--button-3));
    }
    .pad-3 {
      bottom: 0;
      right: 0;
      border-radius: 0 0 100% 0;
      background: linear-gradient(315deg, #7b9ad0, var(--button-4));
    }

    .pad.active {
      transform: translateY(2px) scale(0.98);
      box-shadow:
        inset 0 0 20px rgba(0, 0, 0, 0.7),
        0 4px 8px rgba(0, 0, 0, 0.7);
      filter: brightness(1.15);
    }

    .pad.active::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--button-active-overlay);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .center-hub {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      inset: 0;
      margin: auto;
      background: radial-gradient(circle at 30% 20%, #20383b 0, #050b0c 70%);
      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.8),
        0 0 0 8px rgba(255, 255, 255, 0.05),
        0 10px 18px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px;
      text-align: center;
    }

    .center-title {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .center-tagline {
      font-size: 0.6rem;
      color: var(--text-subtle);
      opacity: 0.85;
    }

    .start-button {
      margin-top: 6px;
      padding: 6px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: radial-gradient(circle at 30% 20%, #f3d9a2 0, #c79a46 70%);
      color: var(--bg-main); /* text color */
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 8px 12px rgba(0, 0, 0, 0.85),
        inset 0 0 6px rgba(255, 255, 255, 0.35);
      transition:
        transform 0.12s ease-out,
        box-shadow 0.12s ease-out,
        filter 0.12s ease-out;
    }

    .start-button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
      box-shadow:
        0 10px 16px rgba(0, 0, 0, 0.9),
        inset 0 0 6px rgba(255, 255, 255, 0.45);
    }

    .start-button:active {
      transform: translateY(1px);
      box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.9),
        inset 0 0 3px rgba(0, 0, 0, 0.8);
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--text-subtle);
      margin-top: 6px;
      text-align: center;
      min-height: 1.2em;
    }

    @media (max-width: 520px) {
      .device-shell {
        width: 320px;
        height: 320px;
      }
      .device-ring {
        width: 280px;
        height: 280px;
      }
      .device-inner {
        padding: 22px;
      }
      .center-hub {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-title">Mosaic Simon Says</div>
    <div class="game-subtitle">Action Cures Fear · EnviSyn</div>

    <div class="sound-toggle">
      <label class="switch">
        <!-- default OFF -->
        <input type="checkbox" id="soundToggle" />
        <span class="slider"></span>
      </label>
      <span class="sound-label">Sound</span>
    </div>

    <div class="device-shell">
      <div class="device-ring">
        <div class="device-inner">
          <div class="pad pad-0" data-index="0"></div>
          <div class="pad pad-1" data-index="1"></div>
          <div class="pad pad-2" data-index="2"></div>
          <div class="pad pad-3" data-index="3"></div>

          <div class="center-hub">
            <div class="center-title">Action Cures Fear</div>
            <div class="center-tagline">Follow the light. Then take your next step.</div>
            <button id="startButton" class="start-button">Start</button>
            <div id="status" class="status-text"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* === SOUND EFFECTS (using your filenames) === */
    const padSounds = [
      new Audio("sfx_green.mp3"),   // tile 0
      new Audio("sfx_gold.mp3"),    // tile 1
      new Audio("sfx_white.mp3"),   // tile 2
      new Audio("sfx_bronze.mp3"),  // tile 3
    ];

    const startSound   = new Audio("sfx_start.mp3");
    const successSound = new Audio("sfx_success.mp3");
    const errorSound   = new Audio("sfx_error.mp3");

    padSounds.forEach(s => s.volume = 0.7);
    startSound.volume   = 0.7;
    successSound.volume = 0.75;
    errorSound.volume   = 0.6;

    let soundOn = false;  // default OFF

    const soundToggle = document.getElementById("soundToggle");
    soundToggle.addEventListener("change", () => {
      soundOn = soundToggle.checked;
    });

    function playSound(audio) {
      if (!soundOn || !audio) return;
      audio.currentTime = 0;
      audio.play();
    }

    /* === GAME LOGIC === */

    const pads = Array.from(document.querySelectorAll(".pad"));
    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("status");

    let sequence = [];
    let userIndex = 0;
    let isPlayingBack = false;
    let isUserTurn = false;

    function setStatus(msg) {
      statusText.textContent = msg || "";
    }

    function getRandomPad() {
      return Math.floor(Math.random() * 4);
    }

    function flashPad(index, playback = false) {
      const pad = pads[index];
      if (!pad) return;

      playSound(padSounds[index]);

      pad.classList.add("active");
      setTimeout(() => {
        pad.classList.remove("active");
      }, playback ? 500 : 200);
    }

    function playSequence() {
      isPlayingBack = true;
      isUserTurn = false;
      let i = 0;
      setStatus("Watch the pattern…");

      const interval = setInterval(() => {
        if (i >= sequence.length) {
          clearInterval(interval);
          isPlayingBack = false;
          isUserTurn = true;
          userIndex = 0;
          setStatus("Now repeat the pattern.");
          return;
        }
        const idx = sequence[i];
        flashPad(idx, true);
        i++;
      }, 800);
    }

    function nextRound() {
      sequence.push(getRandomPad());
      playSequence();
    }

    function startGame() {
      playSound(startSound);

      sequence = [];
      userIndex = 0;
      isUserTurn = false;
      isPlayingBack = false;
      setStatus("Ready…");
      setTimeout(nextRound, 600);
    }

    function handleUserPadClick(index) {
      if (!isUserTurn || isPlayingBack) return;

      flashPad(index);

      if (index === sequence[userIndex]) {
        userIndex++;
        if (userIndex === sequence.length) {
          isUserTurn = false;
          setTimeout(() => {
            playSound(successSound);
            setStatus("Well done. Next step…");
            setTimeout(nextRound, 800);
          }, 300);
        }
      } else {
        isUserTurn = false;
        setStatus("That’s okay — try again when you’re ready.");

        playSound(errorSound);

        pads.forEach(p => p.classList.add("active"));
        setTimeout(() => {
          pads.forEach(p => p.classList.remove("active"));
          setStatus("Press Start for a new pattern.");
        }, 700);
      }
    }

    pads.forEach((pad) => {
      pad.addEventListener("click", () => {
        const index = parseInt(pad.getAttribute("data-index"), 10);
        handleUserPadClick(index);
      });
    });

    startButton.addEventListener("click", () => {
      startGame();
    });
  </script>
</body>
</html>
