<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mosaic Simon Says – EnviSyn</title>
  <style>
    :root {
      --bg-main: #020b0d;
      --bg-gradient-top: #07171a;
      --bg-gradient-bottom: #020607;
      --text-main: #f8f4ec;
      --text-subtle: #c7d3cf;
      --accent-gold: #d4b06b;
      --accent-gold-soft: #f3dfb0;

      --pad-glow: rgba(255, 255, 255, 0.45);
      --pad-press-offset: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at top, var(--bg-gradient-top), var(--bg-gradient-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      text-align: center;
      padding: 32px 16px 40px;
    }

    .title h1 {
      letter-spacing: 0.35em;
      font-size: 1rem;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .title h2 {
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-subtle);
    }

    .device-wrapper {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* The card that holds the disc and keeps it vertically centered */
    .device-card {
      position: relative;
      padding: 32px 32px 40px;
      border-radius: 36px;
      background: radial-gradient(circle at top, #07171a, #020607);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .device-shell {
      position: relative;
      width: 640px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 26px 60px rgba(0, 0, 0, 0.9));
      margin: 0 auto;
    }

    /* Disc artwork */
    .disc-bg {
      position: absolute;
      inset: 0;
      background: url("envisyn-disc.png") center/contain no-repeat;
      pointer-events: none; /* clicks go to pad-layer, not the image */
    }

    /* Interactive layer that sits over the disc */
    .pad-layer {
        position: absolute;
        /* a bit smaller so pads sit more inside the ring */
        width: 74%;      /* tweak 70–75% by eye if needed */
        height: 74%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none; /* enable only on .pad */
    }

    /* Base style for each quadrant pad */
    .pad {
        position: absolute;
        width: 72%;          /* smaller overlays */
        height: 72%;
        border: none;
        background: transparent;
        cursor: pointer;
        pointer-events: auto;
        outline: none;
        border: none !important;
        outline: none !important;
        transform-origin: center;
        transition:
            transform 120ms ease,
            box-shadow 120ms ease,
            background-color 120ms ease;
    }

    /* Top-left (Empathy / teal) */
    .pad-0 {
        top: 13%;
        left: 13%;
        /* horizontal mirror of pad-1 radii */
        border-radius: 90% 18% 20% 55%;
        clip-path: polygon(
            45.78% 3.00%,
            42.40% 2.90%,
            36.10% 4.40%,
            30.10% 6.10%,
            24.40% 8.50%,
            19.50% 11.70%,
            13.10% 17.30%,
            7.20% 26.20%,
            3.90% 35.00%,
            2.40% 42.00%,
            3.10% 45.80%,
            5.30% 47.90%,
            29.50% 45.80%,
            32.60% 39.30%,
            36.40% 33.80%,
            41.60% 29.70%,
            45.50% 28.10%,
            47.40% 26.80%,
            48.60% 14.20%,
            49.20% 4.70%
        );
    }

    /* Top-right (Courage / silver) — your original */
    .pad-1 {
        top: 13%;
        right: 13%;
        border-radius: 18% 90% 55% 20%;
        clip-path: polygon(54.22% 1.75%, 61.59% 0.41%, 66.58% 0.25%, 72.12% 0.92%, 79.4% 3.95%, 85.01% 7.31%, 91.1% 12.72%, 94.96% 18.99%, 98.19% 25.08%, 100% 32.9%, 100% 41.38%, 96.9% 45.8%, 94.7% 47.9%, 70.5% 45.8%, 67.4% 39.3%, 63.6% 33.8%, 58.4% 29.7%, 54.5% 28.1%, 52.6% 26.8%, 51.4% 14.2%, 50.8% 4.7%);
    }

    /* Bottom-right (Success / bronze) */
    .pad-2 {
        bottom: 13%;
        right: 13%;
        /* vertical mirror of pad-1 radii */
        border-radius: 20% 55% 90% 18%;
        clip-path: polygon(
            54.22% 97.00%,
            57.60% 97.10%,
            63.90% 95.60%,
            69.90% 93.90%,
            75.60% 91.50%,
            80.50% 88.30%,
            86.90% 82.70%,
            92.80% 73.80%,
            96.10% 65.00%,
            97.60% 58.00%,
            96.90% 54.20%,
            94.70% 52.10%,
            70.50% 54.20%,
            67.40% 60.70%,
            63.60% 66.20%,
            58.40% 70.30%,
            54.50% 71.90%,
            52.60% 73.20%,
            51.40% 85.80%,
            50.80% 95.30%
        );
    }

    /* Bottom-left (Confidence / gold) */
    .pad-3 {
        bottom: 13%;
        left: 13%;
        /* both axes mirrored radii */
        border-radius: 55% 20% 18% 90%;
        clip-path: polygon(
            45.78% 97.00%,
            42.40% 97.10%,
            36.10% 95.60%,
            30.10% 93.90%,
            24.40% 91.50%,
            19.50% 88.30%,
            13.10% 82.70%,
            7.20% 73.80%,
            3.90% 65.00%,
            2.40% 58.00%,
            3.10% 54.20%,
            5.30% 52.10%,
            29.50% 54.20%,
            32.60% 60.70%,
            36.40% 66.20%,
            41.60% 70.30%,
            45.50% 71.90%,
            47.40% 73.20%,
            48.60% 85.80%,
            49.20% 95.30%
        );
    }


    /* Light “halo” when active */
    .pad::before {
        content: "";
        position: absolute;
        inset: -8%; /* slightly larger than the pad */
        border-radius: inherit;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        filter: blur(6px);
        transition: opacity 140ms ease;
    }

    /* Teal glow – top-left */
    .pad-0::before {
    background: radial-gradient(circle at 50% 35%,
        rgba(64, 210, 200, 0.9),
        rgba(64, 210, 200, 0.0) 70%
    );
    }

    /* Silver/white glow – top-right */
    .pad-1::before {
    background: radial-gradient(circle at 50% 35%,
        rgba(230, 236, 245, 0.9),
        rgba(230, 236, 245, 0.0) 70%
    );
    }

    /* Bronze glow – bottom-right */
    .pad-2::before {
    background: radial-gradient(circle at 50% 35%,
        rgba(195, 132, 82, 0.9),
        rgba(195, 132, 82, 0.0) 70%
    );
    }

    /* Gold glow – bottom-left */
    .pad-3::before {
    background: radial-gradient(circle at 50% 35%,
        rgba(215, 180, 95, 0.9),
        rgba(215, 180, 95, 0.0) 70%
    );
    }

    .pad.active::before {
      opacity: 1;
    }

    .pad.pressed {
      transform: translateY(var(--pad-press-offset));
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7) inset;
    }

    /* Center “Start Sequence” button overlayed exactly at disc center */
    .start-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 155px;
      height: 155px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: radial-gradient(circle at 30% 15%, #ffffff, var(--accent-gold-soft));
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.8),
        0 0 0 2px rgba(0, 0, 0, 0.35);
      color: #3b3422;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: auto;
    }

    .start-overlay span.small {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      opacity: 0.8;
    }

    .start-overlay:active {
      transform: translate(-50%, -50%) translateY(2px);
      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(0, 0, 0, 0.45);
    }

    .status-row {
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-size: 0.85rem;
      color: var(--text-subtle);
    }

    /* Sound toggle */
    .sound-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-label {
      font-size: 0.85rem;
      color: var(--text-subtle);
    }

    .toggle-switch {
      position: relative;
      width: 42px;
      height: 22px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #444;
      border-radius: 999px;
      transition: background-color 0.18s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #f5f5f5;
      border-radius: 50%;
      transition: transform 0.18s ease;
    }

    .toggle-switch input:checked + .slider {
      background-color: #27ae60;
    }

    .toggle-switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    @media (max-width: 540px) {
      .device-card {
        padding: 24px 16px 30px;
      }
      .device-shell {
        width: 488px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title">
      <h1>MOSAIC SIMON SAYS</h1>
      <h2>Action Cures Fear · EnviSyn Edition</h2>
    </div>

    <div class="device-wrapper">
      <div class="device-card">
        <div class="device-shell">
          <div class="disc-bg"></div>

          <!-- Interactive overlay -->
          <div class="pad-layer">
            <button class="pad pad-0" data-index="0" aria-label="Empathy pad"></button>
            <button class="pad pad-1" data-index="1" aria-label="Courage pad"></button>
            <button class="pad pad-2" data-index="2" aria-label="Success pad"></button>
            <button class="pad pad-3" data-index="3" aria-label="Confidence pad"></button>
          </div>

          <!-- Centered Start Sequence button -->
          <button class="start-overlay" id="sequenceButton">
            <span class="small">Start</span>
            SEQUENCE
          </button>
        </div>

        <div class="status-row">
          <div id="statusText">
            Status: Tap “Start Sequence” to begin
          </div>

          <div class="sound-toggle">
            <span class="toggle-label">Sound</span>
            <label class="toggle-switch">
              <input type="checkbox" id="soundToggle" />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- STATE ---
    const pads = Array.from(document.querySelectorAll(".pad"));
    const sequenceButton = document.getElementById("sequenceButton");
    const statusText = document.getElementById("statusText");
    const soundToggle = document.getElementById("soundToggle");

    let sequence = [];
    let userIndex = 0;
    let isPlayingSequence = false;
    let isUserTurn = false;
    let soundEnabled = false; // default OFF

    // --- AUDIO (filenames as you specified) ---
    const sfxPad = [
      new Audio("sfx_green.mp3"),   // pad-0
      new Audio("sfx_white.mp3"),   // pad-1
      new Audio("sfx_bronze.mp3"),  // pad-2
      new Audio("sfx_gold.mp3"),    // pad-3
    ];
    const sfxStart = new Audio("sfx_start.mp3");
    const sfxSuccess = new Audio("sfx_success.mp3");
    const sfxError = new Audio("sfx_error.mp3");

    function playSound(audio) {
      if (!soundEnabled || !audio) return;
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    // --- VISUAL STATES ---
    function flashPad(index, delay = 0, duration = 550) {
      const pad = pads[index];
      if (!pad) return;

      setTimeout(() => {
        pad.classList.add("active");
        playSound(sfxPad[index]);

        setTimeout(() => {
          pad.classList.remove("active");
        }, duration - 150);
      }, delay);
    }

    function pressPad(index) {
      const pad = pads[index];
      if (!pad) return;
      pad.classList.add("pressed");
      setTimeout(() => pad.classList.remove("pressed"), 120);
    }

    function flashAllPadsError() {
      pads.forEach((pad) => pad.classList.add("active"));
      playSound(sfxError);
      setTimeout(() => pads.forEach((pad) => pad.classList.remove("active")), 500);
    }

    // --- GAME LOGIC ---
    function startNewRound() {
      sequence = [];
      userIndex = 0;
      addStepToSequence();
      playSequence();
    }

    function addStepToSequence() {
      const next = Math.floor(Math.random() * 4);
      sequence.push(next);
    }

    function playSequence() {
      isPlayingSequence = true;
      isUserTurn = false;
      userIndex = 0;

      statusText.textContent = "Watch the lights…";

      const baseDelay = 700;
      sequence.forEach((index, i) => {
        flashPad(index, i * baseDelay);
      });

      const total = sequence.length * baseDelay + 200;
      setTimeout(() => {
        isPlayingSequence = false;
        isUserTurn = true;
        statusText.textContent = "Now repeat the pattern.";
      }, total);
    }

    function handleUserPadClick(index) {
      if (!isUserTurn || isPlayingSequence) return;

      pressPad(index);
      flashPad(index, 0, 350); // short visual + sound

      const expected = sequence[userIndex];
      if (index !== expected) {
        isUserTurn = false;
        statusText.textContent = "Almost. Let’s try again.";
        flashAllPadsError();
        return;
      }

      userIndex++;

      if (userIndex === sequence.length) {
        // Round complete
        isUserTurn = false;
        playSound(sfxSuccess);
        statusText.textContent = "Nice! Preparing a new pattern…";
        setTimeout(() => {
          addStepToSequence();
          playSequence();
        }, 1000);
      }
    }

    function handleStart() {
      if (isPlayingSequence) return;
      playSound(sfxStart);
      statusText.textContent = "Starting new pattern…";
      startNewRound();
    }

    // --- EVENT BINDINGS ---
    pads.forEach((pad) => {
      pad.addEventListener("click", () => {
        const index = parseInt(pad.getAttribute("data-index"), 10);
        handleUserPadClick(index);
      });
    });

    sequenceButton.addEventListener("click", handleStart);

    soundToggle.addEventListener("change", () => {
      soundEnabled = soundToggle.checked;
    });
  </script>
</body>
</html>
